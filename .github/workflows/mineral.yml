name: Mineral

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

concurrency:
  group: mineral
  cancel-in-progress: true

jobs:
  fishing:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          printf '%s' "$BOT_TOKEN" > ./session
          printf '%s' "$API_ID" > ./api_id
          printf '%s' "$API_HASH" > ./api_hash

      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      - name: Start Mineral
        run: |
          bun install && bun run ./src/index.js

      - name: Publish Result
        uses: EndBug/add-and-commit@v9
        with:
          add: '["./result"]'
          default_author: github_actions
          fetch: false
          message: "Update Subscriptions"
